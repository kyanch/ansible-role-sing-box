# code: language=ansible
# vim: set filetype=yaml.ansible :
---
- name: add sing-box config group
  ansible.builtin.group:
    name: "{{ sing_box_config_group }}"

- name: mkdir config dir
  ansible.builtin.file:
    path: "{{ sing_box_config_path }}"
    mode: '0755'
    state: directory

- name: render systemd service
  ansible.builtin.template:
    src: sing-box.service.ini.j2
    dest: "/etc/systemd/system/{{ sing_box_service_name }}.service"
    mode: "0644"
  notify:
    - enable sing-box
    - restart sing-box

- name: fetch remote config to override sing_box_config
  no_log: true
  when:
    - sing_box_sub_url | default('') | length > 0
  block:
    - name: Fetch remote config to override sing_box_config
      ansible.builtin.uri:
        url: "{{ sing_box_sub_url }}"
        method: GET
        return_content: true
        status_code: 200
      register: sing_box_sub_response

    - name: Override sing_box_config
      ansible.builtin.set_fact:
        sing_box_config: "{{ sing_box_sub_response.content }}"

- name: render local config
  ansible.builtin.copy:
    content: "{{ sing_box_config }}"
    dest: "{{ sing_box_config_path }}/sing-box.json"
    validate: "{{ sing_box_binary_path }}/sing-box check -c %s"
    mode: "{{ sing_box_config_mode }}"
    owner: "root"
    group: "{{ sing_box_config_group }}"
  notify:
    - enable sing-box
    - restart sing-box
