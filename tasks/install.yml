# code: language=ansible
# vim: set filetype=yaml.ansible :
---
- name: read installed sing-box version
  ansible.builtin.command: "{{ sing_box_bin_path }} version"
  register: sing_box_installed
  changed_when: false
  failed_when: false

- name: download and unarchive sing-box release
  ansible.builtin.unarchive:
    src: "{{ sing_box_download_url }}"
    dest: "{{ sing_box_binary_path }}"
    mode: '0755'
    extra_opts:
      - --strip-components=1
    exclude:
      - LICENSE
    remote_src: true
  when: >-
    (sing_box_installed.stdout_lines | default([]) | first | default(''))
    != 'sing-box version ' ~ sing_box_version
  notify:
    - restart sing-box
    - enable sing-box
