# code: language=ansible
# vim: set filetype=yaml.ansible :
---
sing_box_version: 1.14.4

sing_box_arch_map:
  x86_64: amd64
  aarch64: arm64
sing_box_arch: "{{ sing_box_arch_map[ansible_architecture] }}"

sing_box_release_base: "https://github.com/SagerNet/sing-box/releases/download/v{{ sing_box_version }}"
sing_box_archive_name: "sing-box-{{ sing_box_version }}-linux-{{ sing_box_arch }}.tar.gz"
sing_box_download_url: "{{ sing_box_release_base }}/{{ sing_box_archive_name }}"
sing_box_binary_path: /usr/local/bin
sing_box_user: sing-box
sing_box_service_name: sing-box
sing_box_config_group: sing-box-config
sing_box_config_path: "/etc/{{ sing_box_service_name }}"
sing_box_config_mode: '0640'
sing_box_config: |
  define your own sing box config (here you may use jinja for templating)
sing_box_default_unit_options:
  Wants: network-online.target
  After: network-online.target
sing_box_default_service_options:
  User: "{{ sing_box_user }}"
  Restart: always
  TimeoutStopSec: 5s
  LimitNOFILE: 1048576
  ProtectSystem: strict
  ProtectHome: tmpfs
  PrivateTmp: true
  PrivateDevices: true
  ProtectKernelTunables: true
  ProtectKernelModules: true
  ProtectKernelLogs: true
  ProtectControlGroups: true
  MemoryDenyWriteExecute: true
  LockPersonality: true
  RestrictRealtime: true
  ProtectClock: true
  RestartSec: 10
  StartLimitBurst: 30
  StartLimitIntervalSec: 30
  AmbientCapabilities: CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
  CapabilityBoundingSet: CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
